<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="grad-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="grad-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>
  <!-- Outer double ring -->
  <circle cx="24" cy="24" r="22" stroke="url(#grad-ring)" stroke-width="2.5"/>
  <circle cx="24" cy="24" r="19" stroke="#303743" stroke-width="1"/>
  <!-- 8 Aperture Blades -->
  <line x1="24" y1="5" x2="33" y2="19" stroke="url(#grad-ring)" stroke-width="2" stroke-linecap="round"/>
  <line x1="37.4" y1="10.6" x2="35" y2="27" stroke="url(#grad-ring)" stroke-width="2" stroke-linecap="round"/>
  <line x1="43" y1="24" x2="29" y2="33" stroke="url(#grad-ring)" stroke-width="2" stroke-linecap="round"/>
  <line x1="37.4" y1="37.4" x2="21" y2="35" stroke="url(#grad-ring)" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="43" x2="15" y2="29" stroke="url(#grad-ring)" stroke-width="2" stroke-linecap="round"/>
  <line x1="10.6" y1="37.4" x2="13" y2="21" stroke="url(#grad-ring)" stroke-width="2" stroke-linecap="round"/>
  <line x1="5" y1="24" x2="19" y2="15" stroke="url(#grad-ring)" stroke-width="2" stroke-linecap="round"/>
  <line x1="10.6" y1="10.6" x2="27" y2="13" stroke="url(#grad-ring)" stroke-width="2" stroke-linecap="round"/>
  <!-- Center Octagonal Aperture Core with Histogram Waveform -->
  <polygon points="24,18 28.2,19.8 30,24 28.2,28.2 24,30 19.8,28.2 18,24 19.8,19.8" fill="#191D24" stroke="url(#grad-core)" stroke-width="1.8"/>
  <path d="M21 25.5 L22.5 22.5 L24 24.5 L25.5 21 L27 25.5" stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>